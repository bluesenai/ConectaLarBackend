
# Conexao com o banco H2
spring.datasource.url=jdbc:h2:file:./data/conectalar
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracao JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracao JWT
jwt.secret=${JWT_SECRET:ConectaLar_Chave_Local_Teste_2026_8f3a91c7d2b64e50_ExtraSegura}
jwt.expiration=3600000

# Configuração da transmissão da câmera
camera.rtsp.port=554
camera.rtsp.stream-path=/Streaming/Channels/101
camera.connection-timeout=5000
camera.rtsp.host=${CAMERA_RTSP_HOST:}
camera.rtsp.username=${CAMERA_RTSP_USERNAME:}
camera.rtsp.password=${CAMERA_RTSP_PASSWORD:}


# Configuração do MediaMTX
mediamtx.hls.base-url=http://localhost:8888

# API de controle do MediaMTX
mediamtx.api.base-url=http://127.0.0.1:9997

# Caminho da transmissão no MediaMTX
mediamtx.stream.path-prefix=camera